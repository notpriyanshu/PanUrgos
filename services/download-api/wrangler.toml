name = "panurgos-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Clean up expired tokens once a day.
[triggers]
crons = ["17 3 * * *"]

[vars]
SITE_URL = "https://panurgos.com"
# Origins allowed to call the API (comma-separated).
ALLOWED_ORIGINS = "https://panurgos.com,https://www.panurgos.com"
FROM_EMAIL = "PanUrgos <downloads@panurgos.com>"
CONTACT_EMAIL = ""
API_URL = "https://panurgos-api.panurgos-download-api.workers.dev"
# Public OAuth client IDs (secrets GOOGLE_CLIENT_SECRET / GITHUB_CLIENT_SECRET are set with wrangler). Empty = that button is off.
GOOGLE_CLIENT_ID = "409768074169-r58mf3m4364h5tefs3pg1jnk4r8iuh7f.apps.googleusercontent.com"
GITHUB_CLIENT_ID = "Ov23liUKpLhuWcWZXoO9"
# Installers in the private R2 bucket. A platform missing here is "coming soon".
INSTALLERS = '{"win":{"key":"1.0.0/PanUrgos-Studio-Setup-1.0.0.exe","file":"PanUrgos-Studio-Setup-1.0.0.exe","version":"1.0.0"}}'

[[d1_databases]]
binding = "DB"
database_name = "panurgos-downloads"
database_id = "15301656-5f1e-405d-b6c8-e573f8a4fcbb"

[[r2_buckets]]
binding = "INSTALLERS_BUCKET"
bucket_name = "panurgos-installers"

# Per-IP request limit, counted in memory by Cloudflare and never stored.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secrets (set with `wrangler secret put`): RESEND_API_KEY, STATS_KEY

# Local development only.
[env.dev.vars]
SITE_URL = "http://127.0.0.1:4173"
API_URL = "http://127.0.0.1:8787"
ALLOWED_ORIGINS = "http://127.0.0.1:4173,http://localhost:4173"
FROM_EMAIL = "PanUrgos <downloads@panurgos.com>"
CONTACT_EMAIL = "privacy@example.test"
INSTALLERS = '{"win":{"key":"1.0.0/PanUrgos-Studio-Setup-1.0.0.exe","file":"PanUrgos-Studio-Setup-1.0.0.exe","version":"1.0.0"}}'
DEV_LOG_EMAILS = "1"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "panurgos-downloads"
database_id = "local-dev"

[[env.dev.r2_buckets]]
binding = "INSTALLERS_BUCKET"
bucket_name = "panurgos-installers"

[[env.dev.ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 1000, period = 60 }
